# Render Blueprint Specification for Student Result Management System (SRMS)
# Official Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: srms-portal
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: wsgi:app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CAPTCHA_MODE
        value: turnstile
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        sync: false
      - key: LOG_LEVEL
        value: INFO
