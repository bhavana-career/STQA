[pytest]
testpaths = tests academic
pythonpath = .
markers =
    unit: Fast in-process unit tests without external dependencies.
    integration: Integration tests with Flask test client and database.
    e2e: End-to-end browser automation tests using Selenium WebDriver.
    external: Tests executed against an external deployed URL.
    academic: Separate academic syllabus lab demonstrations.
    fault_demo: Intentional fault injection and defect lifecycle demonstrations.
    captcha_live: E2E tests interacting with live Turnstile verification.
addopts = -v --strict-markers
