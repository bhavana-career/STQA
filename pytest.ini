[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
markers =
    unit: Unit tests for core business logic
    functional: Functional tests for application routes and features
    integration: Integration tests across services and storage
    blackbox: Black-box testing techniques (EP, BVA, Decision Table)
    whitebox: White-box testing techniques (Statement, Branch, Condition, Path)
    e2e: End-to-End Selenium browser automation tests
